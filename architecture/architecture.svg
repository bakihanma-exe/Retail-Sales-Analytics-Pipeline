<title id="title">AdventureWorks Azure data pipeline</title>
<desc id="desc">GitHub CSV source flows through Azure Data Factory into ADLS Gen2 Bronze, Databricks PySpark Silver, Synapse Serverless SQL Gold views, and Power BI.</desc>
