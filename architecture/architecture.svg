<g font-family="Arial,sans-serif" text-anchor="middle">
<g><rect x="35" y="135" width="190" height="150" rx="16" fill="#fff" stroke="#7b91a8" stroke-width="2"/><text x="130" y="180" font-size="22" font-weight="700" fill="#18324b">GitHub</text><text x="130" y="215" font-size="16" fill="#41566d">10 AdventureWorks</text><text x="130" y="239" font-size="16" fill="#41566d">CSV source files</text></g>
