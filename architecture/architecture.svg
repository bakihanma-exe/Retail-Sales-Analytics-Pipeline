<g><rect x="755" y="135" width="190" height="150" rx="16" fill="#e8f7ef" stroke="#2d9460" stroke-width="2"/><text x="850" y="180" font-size="22" font-weight="700" fill="#17613b">Databricks</text><text x="850" y="215" font-size="19" font-weight="700" fill="#17613b">SILVER</text><text x="850" y="245" font-size="15" fill="#3f6651">PySpark transformations</text></g>
